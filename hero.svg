<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Pacote de figurinhas estourando com moedas, estrelas e barra de experiência" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD98A"/><stop offset=".45" stop-color="#F0A92E"/><stop offset="1" stop-color="#B8720C"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39425A"/><stop offset="1" stop-color="#1A2030"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3A6"/><stop offset="1" stop-color="#E29A22"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A92E"/><stop offset="1" stop-color="#2FBF71"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F0A92E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F0A92E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <circle cx="450" cy="250" r="250" fill="url(#glow)"/>

  <!-- raios -->
  <g opacity=".22" stroke="#F0A92E" stroke-width="3" stroke-linecap="round">
    <path d="M450 40v46M450 414v46M170 250h46M684 250h46"/>
    <path d="M251 51l26 38M623 411l26 38M251 449l26-38M623 89l26-38"/>
  </g>

  <!-- figurinhas em leque, proporção 49x65 -->
  <g filter="url(#soft)">
    <g transform="translate(232 196) rotate(-17)">
      <rect width="147" height="195" rx="12" fill="url(#card)" stroke="#E8E2D4" stroke-opacity=".18" stroke-width="2"/>
      <rect x="12" y="12" width="123" height="130" rx="7" fill="#0E1116" opacity=".55"/>
      <circle cx="73" cy="72" r="30" fill="#2FBF71" opacity=".85"/>
      <path d="M58 86c4-16 26-16 30 0" fill="#0E1116" opacity=".35"/>
      <rect x="12" y="154" width="86" height="12" rx="6" fill="#E8E2D4" opacity=".35"/>
      <rect x="12" y="172" width="54" height="10" rx="5" fill="#E8E2D4" opacity=".18"/>
    </g>

    <g transform="translate(572 196) rotate(17)">
      <rect width="147" height="195" rx="12" fill="url(#card)" stroke="#E8E2D4" stroke-opacity=".18" stroke-width="2"/>
      <rect x="12" y="12" width="123" height="130" rx="7" fill="#0E1116" opacity=".55"/>
      <path d="M40 120l30-42 24 30 18-20 22 32z" fill="#A8323C" opacity=".9"/>
      <circle cx="104" cy="52" r="14" fill="#F0A92E" opacity=".8"/>
      <rect x="12" y="154" width="98" height="12" rx="6" fill="#E8E2D4" opacity=".35"/>
      <rect x="12" y="172" width="46" height="10" rx="5" fill="#E8E2D4" opacity=".18"/>
    </g>

    <!-- lendária, no centro -->
    <g transform="translate(386 138)">
      <rect width="168" height="223" rx="13" fill="url(#cardGold)" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
      <rect x="13" y="13" width="142" height="150" rx="8" fill="#231703" opacity=".82"/>
      <path d="M84 44l13 27 30 4-22 21 5 30-26-14-26 14 5-30-22-21 30-4z" fill="#FFD98A"/>
      <rect x="13" y="176" width="104" height="14" rx="7" fill="#231703" opacity=".55"/>
      <rect x="13" y="197" width="62" height="11" rx="5" fill="#231703" opacity=".3"/>
      <g transform="translate(120 176)">
        <circle r="22" cx="14" cy="14" fill="#A8323C"/>
        <text x="14" y="20" text-anchor="middle" font-family="Archivo Black, Impact, sans-serif" font-size="17" fill="#fff">L</text>
      </g>
    </g>
  </g>

  <!-- pacote rasgado, na frente -->
  <g filter="url(#soft)" transform="translate(348 300)">
    <path d="M12 32h180l-8 142a14 14 0 0 1-14 13H34a14 14 0 0 1-14-13z" fill="url(#foil)"/>
    <path d="M6 30l16-14 18 12 18-14 18 12 18-14 18 12 18-14 18 12 18-14 16 14-8 16H14z" fill="#FFE3A6"/>
    <g opacity=".25" fill="#231703">
      <rect x="30" y="70" width="140" height="10" rx="5"/>
      <rect x="30" y="92" width="100" height="10" rx="5"/>
    </g>
    <text x="100" y="152" text-anchor="middle" font-family="Archivo Black, Impact, sans-serif" font-size="30" fill="#231703">+5</text>
  </g>

  <!-- moedas e estrelas -->
  <g>
    <g transform="translate(196 96)"><circle r="21" fill="#F0A92E" stroke="#FFE3A6" stroke-width="4"/><text y="7" text-anchor="middle" font-family="Archivo Black, Impact, sans-serif" font-size="19" fill="#231703">XP</text></g>
    <g transform="translate(722 128)"><circle r="16" fill="#F0A92E" stroke="#FFE3A6" stroke-width="3"/></g>
    <g transform="translate(676 66)"><path d="M0-15l4.5 9.5L15-4 7.5 3.5 9.5 14 0 9-9.5 14l2-10.5L-15-4l10.5 1.5z" fill="#2FBF71"/></g>
    <g transform="translate(160 330)"><path d="M0-18l5.4 11.4L18-4.8 9 4.2l2.4 12.6L0 10.8-11.4 16.8 -9 4.2-18-4.8l12.6-1.8z" fill="#E8E2D4" opacity=".8"/></g>
    <g transform="translate(760 336)"><path d="M0-13l3.9 8.2L13-3.5 6.5 3l1.7 9.1L0 7.8-8.2 12.1 -6.5 3-13-3.5l9.1-1.3z" fill="#A8323C"/></g>
  </g>

  <!-- barra de experiência -->
  <g transform="translate(250 480)">
    <rect width="400" height="26" rx="13" fill="#171C25" stroke="#E8E2D4" stroke-opacity=".16" stroke-width="2"/>
    <rect x="4" y="4" width="268" height="18" rx="9" fill="url(#xp)"/>
    <g transform="translate(-34 13)">
      <circle r="27" fill="#0E1116" stroke="#F0A92E" stroke-width="4"/>
      <text y="8" text-anchor="middle" font-family="Archivo Black, Impact, sans-serif" font-size="22" fill="#F0A92E">7</text>
    </g>
    <text x="400" y="-12" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="15" fill="#A9A396">268 / 400 XP</text>
  </g>
</svg>
